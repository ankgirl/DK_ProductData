<!-- admin_generated_barcodes.html — 생성 바코드(DK+9자리) 기록 조회 · 라벨 프린트 (관리자 전용) -->
<!-- 용도: 신상 입고 화면에서 발급한 바코드를 한 곳에서 보고, 제품 수량만큼 라벨을 뽑는다. -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생성 바코드 기록·프린트 (관리자)</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        .content { max-width: 1250px; margin: 0 auto; padding: 16px; }
        .gb-input { background: #f3f0f8; border: 1px solid #d8cfe6; border-radius: 6px; padding: 12px 14px; margin: 12px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .gb-input input[type=text] { padding: 8px; font-size: 1em; }
        .gb-input select, .gb-input button { padding: 8px 12px; font-size: 0.95em; }
        .gb-input label.chk { display: inline-flex; align-items: center; gap: 5px; font-size: 0.92em; color: #3a2b4d; }
        .gb-bar { position: sticky; top: 0; z-index: 5; background: #efe9f5; border: 1px solid #d8cfe6; border-radius: 6px; padding: 10px 14px; margin: 8px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .gb-bar b { color: #3a2b4d; }
        .gb-print { padding: 8px 18px; font-size: 0.95em; font-weight: bold; cursor: pointer; border: 1px solid #7fc97f; background: #d7f0d7; border-radius: 6px; }
        .gb-print:hover { background: #c3e8c3; }
        .gb-print:disabled { opacity: .45; cursor: default; }
        .gb-btn { padding: 6px 12px; font-size: 0.88em; cursor: pointer; border: 1px solid #b9a7d4; background: #fff; border-radius: 5px; }
        .gb-btn:hover { background: #f3eefa; }
        .gb-size input { width: 54px; padding: 4px; text-align: center; }
        .gb-table { border-collapse: collapse; width: 100%; margin: 10px 0; }
        .gb-table th, .gb-table td { border: 1px solid #ccc; padding: 6px 8px; vertical-align: middle; text-align: center; }
        .gb-table thead th { background: #3a2b4d; color: #fff; position: sticky; top: 52px; z-index: 4; }
        /* 제품(셀러코드) 단위 묶음 — 헤더줄 + 블록마다 번갈아 다른 색/왼쪽 띠로 구분 */
        .gb-table .gb-prod-head td { text-align: left; font-weight: bold; padding: 8px 10px; border-top: 3px solid #3a2b4d; }
        .gb-table .gb-prod-head a { color: #3a2b4d; }
        .gb-table .gb-prod-head .chk { display: inline-flex; vertical-align: middle; margin-right: 4px; }
        .gb-table tr.gb-g0 { background: #ffffff; }
        .gb-table tr.gb-g1 { background: #f4f1fa; }
        .gb-table tr.gb-prod-head.gb-g0 { background: #e7dff2; }
        .gb-table tr.gb-prod-head.gb-g1 { background: #dcd2ee; }
        .gb-table tr.gb-g0 td:first-child { border-left: 4px solid #b9a7d4; }
        .gb-table tr.gb-g1 td:first-child { border-left: 4px solid #7e6aa5; }
        .gb-table img { width: 56px; height: 56px; object-fit: contain; display: block; margin: 0 auto; }
        .gb-table .col-bc { font-family: Consolas, monospace; font-weight: bold; letter-spacing: .3px; white-space: nowrap; }
        .gb-table .col-opt { font-size: .88em; text-align: left; }
        .gb-table .col-code { white-space: nowrap; font-weight: bold; }
        .gb-table input.qty { width: 62px; padding: 4px; text-align: center; }
        .gb-orphan { color: #a33; }
        .badge { font-size: .72em; border-radius: 4px; padding: 1px 5px; }
        .badge-printed { background: #d7e8ff; color: #1a4b8c; }
        .badge-new { background: #ffe9c7; color: #8a5a00; }
        .badge-orphan { background: #ffd9d9; color: #a33; }
        /* 화면 미리보기(실제 인쇄 라벨과 같은 mm 크기) */
        .preview-wrap { display: flex; align-items: center; gap: 10px; }
        .preview-box { border: 1px dashed #b9a7d4; background: #fff; display: inline-block; overflow: hidden; vertical-align: middle; }
        .preview-box .lbl { width: 100%; height: 100%; box-sizing: border-box; padding: 1mm; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; overflow: hidden; }
        .preview-box .bc-text { font-family: Consolas, "Malgun Gothic", monospace; font-weight: 700; letter-spacing: -0.2px; line-height: 1.05; }
        .preview-box .bc-svg { margin-bottom: 0.6mm; }
        .muted { color: #888; font-size: 0.85em; }
        .warn { color: #c0392b; font-weight: bold; }
        #status { color: #555; }
    </style>
</head>
<body>
    <div id="navbar"></div>
    <div class="content">
        <h1>생성 바코드 기록·프린트 <span class="muted">· 셀러코드 역순(최신 위) · 제품별 묶음</span></h1>
        <p class="muted">
            신상 입고 화면에서 <b>🎲</b>로 발급한 <b>DK+9자리</b> 바코드 기록입니다. 지금까지 쓴 번호가 모두 여기 모입니다(중복 발급 불가).
            선택한 항목을 <b>매수(기본=개별수량+세트수량)</b>만큼 <b>Code128 라벨</b>로 인쇄합니다. 인쇄하면 이력이 남아 무엇을 몇 장 뽑았는지 확인할 수 있습니다.
        </p>

        <div class="gb-input">
            <label>입고차수 <input type="text" id="categoryInput" list="categoryList" placeholder="예: 71 — 비우면 전체" autocomplete="off" style="width:150px"></label>
            <datalist id="categoryList"></datalist>
            <select id="periodSelect" title="발급 시점">
                <option value="all">기간: 전체</option>
                <option value="today">오늘 발급분</option>
                <option value="7d">최근 7일</option>
            </select>
            <label>검색 <input type="text" id="q" placeholder="셀러코드·옵션명·바코드" style="width:190px"></label>
            <label class="chk"><input type="checkbox" id="unprintedOnly"> 미인쇄만</label>
            <label class="chk" title="상품에서 이 바코드를 더 이상 쓰지 않는 기록(옛 발급분·교체됨)도 표시"><input type="checkbox" id="showOrphan"> 미연결 기록 포함</label>
            <span id="status"></span>
        </div>

        <div class="gb-bar">
            <label class="chk"><input type="checkbox" id="selAll"> 전체선택</label>
            <span id="selInfo"><b>0</b>건 선택 · 라벨 <b>0</b>장</span>
            <span class="gb-size" title="프린터에 넣은 라벨 크기(가로×세로 mm) — 현재 쓰는 라벨은 50×30">🖨️ 라벨
                <input type="number" id="labelW" value="50" min="10" max="200" step="1"> ×
                <input type="number" id="labelH" value="30" min="10" max="200" step="1"> mm
            </span>
            <button type="button" id="printBtn" class="gb-print">🖨️ 선택 라벨 프린트</button>
            <button type="button" id="testBtn" class="gb-btn" title="라벨 1장만 시험 인쇄 — 스캐너로 읽히는지 먼저 확인하세요">🧪 테스트 1장</button>
            <button type="button" id="copyBtn" class="gb-btn">📋 선택 바코드 복사</button>
            <span class="preview-wrap"><span class="muted">미리보기</span><span id="preview" class="preview-box"></span></span>
            <span id="warn" class="warn"></span>
        </div>

        <div id="result"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="./firebaseConfig.js"></script>
    <script src="./loadNavbar.js"></script>
    <script src="./imageFallback.js"></script>
    <script src="./clipboardUtils.js?v=1"></script>
    <script src="./barcodeUtils.js?v=4"></script>
    <script src="./imageUrlUtils.js?v=1"></script>
    <script src="./code128.js?v=1"></script>
    <script src="./labelPrint.js?v=1"></script>
    <script src="./generatedBarcodeStore.js?v=1"></script>
    <script src="./admin_generated_barcodes.js?v=2"></script>
</body>
</html>
